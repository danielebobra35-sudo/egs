<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ebobra's Guide to Success</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1424;--s1:#101D33;--s2:#172A47;--line:#25395A;--tx:#E9EFF8;--mu:#97A8C4;--cy:#4CC3E8;--cyd:#123B52;--au:#E2B050;--ok:#4CCB91;--bad:#F2796D;--hd:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--bd:'Figtree','Segoe UI',system-ui,sans-serif;color-scheme:dark}
:root[data-theme="light"]{--bg:#F2F5F9;--s1:#FFFFFF;--s2:#E6EDF6;--line:#CBD7E6;--tx:#0D1A2D;--mu:#4F6178;--cy:#0B6F96;--cyd:#CDE8F3;--au:#8F6208;--ok:#12794A;--bad:#B93526;color-scheme:light}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="light"]){--bg:#F2F5F9;--s1:#FFFFFF;--s2:#E6EDF6;--line:#CBD7E6;--tx:#0D1A2D;--mu:#4F6178;--cy:#0B6F96;--cyd:#CDE8F3;--au:#8F6208;--ok:#12794A;--bad:#B93526}}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--bd);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--hd);line-height:1.12;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6vw,3.6rem);font-weight:800}h2{font-size:clamp(1.4rem,3.4vw,2rem);font-weight:700}h3{font-size:1.15rem;font-weight:700}
p{margin:0 0 .9em;max-width:68ch}a{color:var(--cy)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;font:800 1.05rem var(--hd);text-decoration:none;color:var(--tx)}
.brand small{display:none;font:500 .8rem var(--bd);color:var(--mu)}
.sp{flex:1}
#backBtn{font-weight:700;padding:7px 12px;min-height:40px}
#backBtn[hidden]{display:none}
.ib{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;color:var(--tx)}
.shell{display:block}
.side{display:none}
.main{padding:20px 16px 110px;max-width:1080px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--s1);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a,.tabbar button{flex:1;text-align:center;padding:9px 2px 8px;font:600 .72rem var(--bd);color:var(--mu);text-decoration:none;background:none;border:0;cursor:pointer}
.tabbar svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar .on{color:var(--cy)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(3,8,16,.6);display:none}
.sheet.open{display:block}
.sheet>div{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--s1);border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet a{display:block;padding:11px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--tx);font-weight:600}
@media(min-width:900px){
 .shell{display:grid;grid-template-columns:230px 1fr}
 .side{display:block;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;border-right:1px solid var(--line);padding:14px 10px}
 .side a{display:block;padding:8px 12px;border-radius:9px;color:var(--mu);text-decoration:none;font-weight:600;font-size:.94rem}
 .side a:hover{color:var(--tx);background:var(--s1)}.side a.on{color:var(--tx);background:var(--cyd);box-shadow:inset 3px 0 0 var(--cy)}
 .tabbar{display:none}.main{padding:32px 36px 60px}.brand small{display:inline}
}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-block;border:1px solid var(--line);background:var(--s1);color:var(--tx);padding:11px 18px;border-radius:11px;font-weight:700;cursor:pointer;text-decoration:none;min-height:44px}
.btn.p{background:var(--cy);border-color:var(--cy);color:#04121F}
:root[data-theme="light"] .btn.p{color:#fff}
.btn.g{background:var(--au);border-color:var(--au);color:#1a1202}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.88rem}
.btn:hover{filter:brightness(1.1)}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel.flat{background:none}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.mu{color:var(--mu)}.sm{font-size:.88rem}.au{color:var(--au)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.tag{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mu)}
.tag.w{border-color:var(--au);color:var(--au)}.tag.c{border-color:var(--cy);color:var(--cy)}
.bar{height:8px;border-radius:9px;background:var(--s2);overflow:hidden}.bar i{display:block;height:100%;background:var(--cy);border-radius:9px}.bar.g i{background:var(--au)}
.field{display:block;margin:0 0 14px}.field>span{display:block;font-weight:600;font-size:.9rem;margin-bottom:5px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:99px;padding:6px 13px;background:var(--bg);cursor:pointer;font-size:.9rem;user-select:none}
.chip.on{background:var(--cyd);border-color:var(--cy);color:var(--tx)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:14px 0 18px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--mu);font-weight:700;white-space:nowrap}
.tabs button.on{color:var(--tx);border-bottom-color:var(--cy)}
.list>*{padding:12px 0;border-bottom:1px solid var(--line)}.list>*:last-child{border:0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:18px;margin:6px 0 22px}
.kv b{display:block;font:800 1.7rem var(--hd)}.kv span{color:var(--mu);font-size:.85rem}
.hero{position:relative;display:grid;gap:10px;padding:8px 0 24px;overflow:hidden}
.hero-art{width:100%;max-width:520px;justify-self:center;margin:-8px auto -10px}
.hero h1{margin-bottom:.3em}.hero .tl{font:700 clamp(1.05rem,2.6vw,1.4rem) var(--hd);color:var(--cy);margin-bottom:.6em}
@media(min-width:900px){.hero{grid-template-columns:1.1fr .9fr;align-items:center;padding:20px 0 34px}}
.rail{display:flex;gap:0;overflow-x:auto;padding:14px 2px 20px;margin:0 -16px;padding-left:16px;scrollbar-width:thin}
.rail div{flex:0 0 auto;min-width:104px;position:relative;padding-top:22px;font:700 .85rem var(--hd);padding-right:10px}
.rail div:before{content:"";position:absolute;top:6px;left:0;right:0;height:2px;background:var(--line)}
.rail div:after{content:"";position:absolute;top:1px;left:0;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--cy)}
.rail div.last:after{background:var(--au);border-color:var(--au)}.rail small{display:block;font:400 .74rem var(--bd);color:var(--mu)}
.why dl{margin:0}.why dt{font:800 1.35rem var(--hd);margin-top:16px}.why dd{margin:2px 0 0;color:var(--mu);max-width:60ch}
.msgs{display:flex;flex-direction:column;gap:10px;min-height:260px;max-height:55vh;overflow:auto;padding:4px 2px}
.msg{padding:10px 14px;border-radius:14px;max-width:88%;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--cyd)}.msg.b{align-self:flex-start;background:var(--s2)}
.opt{display:block;width:100%;text-align:left;margin:0 0 8px;padding:11px 14px;border-radius:11px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.opt.on{border-color:var(--cy);background:var(--cyd)}.opt.ok{border-color:var(--ok)}.opt.no{border-color:var(--bad)}
.card3d{perspective:800px}
.fc{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--s1);cursor:pointer;font-size:1.05rem}
.code{width:100%;min-height:190px}
pre.out{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;white-space:pre-wrap;margin:0;font-size:.88rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:top}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:90vw}
.note{border-left:3px solid var(--au);padding:8px 14px;background:var(--s1);border-radius:0 10px 10px 0;margin:12px 0;max-width:72ch}
.map{width:100%;height:auto;background:var(--s1);border:1px solid var(--line);border-radius:14px}
.map circle.pt{cursor:pointer}
.footer{margin-top:50px;padding-top:16px;border-top:1px solid var(--line);color:var(--mu);font-size:.85rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pulse{animation:pl 2.4s ease-out infinite;transform-origin:center;transform-box:fill-box}@keyframes pl{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
.founder{display:grid;gap:26px;align-items:start;margin:8px 0 10px}
.portrait{width:min(100%,340px);aspect-ratio:3/4;object-fit:cover;object-position:50% 30%;border-radius:14px;border:1px solid var(--line);box-shadow:12px 12px 0 var(--cyd);display:block;margin:0 12px 12px 0}
.pill{display:flex;gap:14px;align-items:center}.pill img{width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:50% 25%;border:2px solid var(--au);flex:0 0 auto}
.thanks{border-left:3px solid var(--au);padding:4px 0 4px 16px;max-width:60ch;font:600 1.15rem/1.5 var(--hd)}
@media(min-width:760px){.founder{grid-template-columns:340px 1fr;gap:44px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>
/* ============ utilities & state ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='egs_state_v1';let S={};
const defaults=()=>({user:null,profile:{},theme:null,xp:0,streak:0,lastDay:'',mastery:{},exams:[],done:{},mission:{},plan:{start:null,days:{},base:null,final:null,baseCode:0},brain:{},portfolio:[],pchk:{},posts:[],log:[],examDate:'',wrong:[],reg:[],fc:{},sub:null});
function load(){let o=null;try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=Object.assign(defaults(),o||{})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=()=>new Date().toISOString().slice(0,10);
function touch(){const t=today();if(S.lastDay!==t){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.lastDay===y?S.streak+1:1;S.lastDay=t}save()}
function addXP(n){S.xp+=n;touch()}
function toast(m){const b=$('#toastBox');b.innerHTML='<div class="toast">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>b.innerHTML='',2600)}

{id:'pressure',course:'MTC 205',topic:'Pressure & wind',title:'Atmospheric pressure',kw:['pressure','barometer','hpa'],
 l1:`Air has weight. Picture a tall stack of pillows on your chest: the pillow at the bottom feels all the pillows above it. The air above you is that stack, and the squeeze it gives you is air pressure.`,
 l2:`Atmospheric pressure is the force per unit area exerted by the weight of the air column above a surface. Standard sea-level pressure is 1013.25 hPa. Pressure falls with height; low-pressure systems are linked to rising air and cloud, high-pressure systems to sinking air and clearer skies.`,
 l3:`Under hydrostatic balance, dp/dz = −ρg. With the ideal gas law p = ρR_dT, an isothermal atmosphere gives p(z) = p₀·exp(−z/H) with scale height H = R_dT/g ≈ 8 km. Forecasters reduce station pressure to mean sea level and analyse horizontal gradients, because the pressure-gradient force drives wind.`,
 f:'dp/dz = −ρg   |   p = ρ R_d T   |   p(z) = p₀ exp(−z/H)',
 ex:`At about 5.5 km altitude the pressure is near 500 hPa, roughly half the sea-level value, because about half of the atmosphere's mass lies below that height.`,
 chk:`If you climb a mountain, does the pressure rise or fall, and why?`},
{id:'greenhouse',course:'MTC 205',topic:'Atmosphere & radiation',title:'Greenhouse effect',kw:['greenhouse','global warming','co2','carbon dioxide','radiation'],
 l1:`A car parked in the sun gets hot inside because sunlight gets in but the heat cannot easily leave. Some gases in the air act like the car's windows for Earth's heat.`,
 l2:`Greenhouse gases (water vapour, CO₂, CH₄, N₂O) absorb and re-emit longwave radiation from Earth's surface. Without them the average surface temperature would be near −18 °C instead of about +15 °C. Adding more of these gases strengthens the effect (a positive radiative forcing).`,
 l3:`Surface temperature response ΔT = λ·ΔF. A common approximation for CO₂ forcing is ΔF ≈ 5.35·ln(C/C₀) W m⁻². Feedbacks (water vapour, ice-albedo, lapse rate, clouds) set the size of λ; cloud feedback remains the largest uncertainty.`,
 f:'ΔF ≈ 5.35 ln(C/C₀)   |   ΔT = λ ΔF',
 ex:`Doubling CO₂ from 280 to 560 ppm gives ΔF ≈ 5.35 × ln 2 ≈ 3.7 W m⁻².`,
 chk:`Why does the Moon, with almost no atmosphere, not have an Earth-like greenhouse effect?`},
{id:'coriolis',course:'MTC 205',topic:'Pressure & wind',title:'Coriolis effect and geostrophic wind',kw:['coriolis','geostrophic','deflect'],
 l1:`Throw a ball to a friend on a spinning merry-go-round and it seems to curve, because the ground under it is turning. Earth spins, so moving air appears to curve too.`,
 l2:`The Coriolis effect is the apparent deflection of moving air caused by Earth's rotation: to the right in the Northern Hemisphere, to the left in the Southern. It is zero at the equator and strongest at the poles, which is why winds circle around pressure centres instead of flowing straight from high to low.`,
 l3:`Coriolis parameter f = 2Ω sin φ with Ω = 7.292×10⁻⁵ s⁻¹. Geostrophic wind V_g = −(1/ρf) ∂p/∂n. The Rossby number Ro = U/(fL) shows when rotation dominates. Near the equator f is small, so geostrophic balance fails and tropical forecasting leans on other dynamics.`,
 f:'f = 2Ω sin φ   |   V_g = −(1/ρf) ∂p/∂n',
 ex:`At 6°N, f ≈ 2 × 7.292×10⁻⁵ × sin 6° ≈ 1.5×10⁻⁵ s⁻¹, about one tenth of its value at the pole.`,
 chk:`Why do tropical cyclones almost never form right on the equator?`},
{id:'diffeq',course:'MTH 202',topic:'First-order equations',title:'Differential equations',kw:['differential','dy/dx','ode','equation'],
 l1:`Imagine a car whose speed changes every second. A differential equation is a rule that says how fast something is changing. Our job is to work out where it ends up.`,
 l2:`A differential equation relates a function to its derivatives. A separable first-order equation dy/dx = g(x)h(y) is solved by separating variables: ∫dy/h(y) = ∫g(x)dx. An initial condition fixes the constant. For example dy/dx = ky gives y = y₀e^{kx}.`,
 l3:`For ay″ + by′ + cy = 0 solve the characteristic equation ar² + br + c = 0. Distinct real roots give C₁e^{r₁x} + C₂e^{r₂x}; repeated roots give (C₁ + C₂x)e^{rx}; complex roots α ± iβ give e^{αx}(C₁cos βx + C₂ sin βx). These models describe cooling, damped oscillation and simple climate box models.`,
 f:'dy/dx = ky ⇒ y = y₀ e^{kx}   |   ar² + br + c = 0',
 ex:`Newton's law of cooling: dT/dt = −k(T − T_env). A 90 °C drink in a 30 °C room has T(t) = 30 + 60e^{−kt}.`,
 chk:`If dy/dx = 3y and y(0) = 2, what kind of function do you expect y to be?`},
{id:'stddev',course:'MTC 208',topic:'Descriptive statistics',title:'Standard deviation',kw:['standard deviation','variance','spread','mean'],
 l1:`Two towns both average 28 °C. In one it is 28 every day; in the other it swings between 20 and 36. Standard deviation is the number that tells you how much the days wobble around the average.`,
 l2:`Standard deviation is the square root of the mean squared deviation from the mean: σ = √(Σ(x − μ)²/N). For a sample, divide by N − 1. A small σ means values cluster near the mean.`,
 l3:`In climatology σ underpins anomalies and z-scores, z = (x − μ)/σ, used in standardised drought indices. Check the distribution first: rainfall is skewed, so a gamma fit is often applied before standardising.`,
 f:'σ = √[ Σ(x − μ)² / N ]   |   z = (x − μ)/σ',
 ex:`Data 2, 4, 4, 4, 5, 5, 7, 9: mean 5; squared deviations sum to 32; σ = √(32/8) = 2.`,
 chk:`What happens to σ if every value is increased by 10?`},
{id:'corr',course:'MTC 208',topic:'Correlation & regression',title:'Correlation and regression',kw:['correlation','regression','relationship','causation'],
 l1:`If ice-cream sales and sunshine hours rise together, they are related, but eating ice cream does not make the sun shine. Correlation measures how closely two things move together.`,
 l2:`Pearson's r ranges from −1 to +1 and measures linear association. Near ±1 is strong, near 0 is weak. Correlation does not prove causation: a third variable or coincidence may explain it.`,
 l3:`r = Cov(X,Y)/(σₓσᵧ), and r² is the variance explained in simple linear regression. Autocorrelation in time series inflates apparent significance, so detrend or use an effective sample size. Spearman's rank correlation is robust to outliers.`,
 f:'r = Cov(X,Y)/(σx σy)   |   y = a + b x',
 ex:`Rainfall and temperature at a monsoon station often show a negative r in the wet season, because cloud and rain cool the surface.`,
 chk:`Does r = −0.8 between rainfall and temperature mean rain causes the temperature to fall?`},
{id:'proj',course:'FEM 202',topic:'Coordinates & projections',title:'Map projections',kw:['projection','mercator','crs','coordinate','map'],
 l1:`Peel an orange and press the peel flat: it tears or stretches. A map projection is a way of flattening Earth's curved surface, and every way distorts something.`,
 l2:`A projection transforms latitude/longitude on a curved surface into plane coordinates. Projections preserve some properties (shape, area, distance, direction) at the cost of others. Mercator preserves local shape but inflates area toward the poles; equal-area projections such as Albers preserve area.`,
 l3:`Choose the projection to match the analysis: store data in WGS84 (EPSG:4326), compute areas and distances in a suitable projected CRS, and always record CRS metadata. When reprojecting rasters use nearest-neighbour resampling for categories and bilinear for continuous values.`,
 f:'EPSG:4326 = WGS84 lat/lon   |   UTM zones are 6° wide',
 ex:`UTM zones 31N and 32N cover most of Nigeria, so metre-based measurements there often use them.`,
 chk:`Why should you not measure the area of Greenland on a Mercator map?`},
{id:'loop',course:'CSC 201',topic:'Loops & conditions',title:'Loops in Python',kw:['loop','python','iterate','range'],
 l1:`Imagine a teacher marking 30 exam scripts: pick one up, mark it, put it down, repeat. A loop tells the computer to repeat steps for each item.`,
 l2:`A for loop iterates over a sequence: for t in temps: print(t). range(n) gives 0 to n−1. Combine loops with an accumulator: total = 0, then total += t inside the loop.`,
 l3:`Prefer vectorised NumPy/pandas operations on big arrays (temps.mean()) since pure Python loops are slow; keep loops for control flow and I/O. List comprehensions and generators give concise, memory-friendly code.`,
 f:'for t in temps:\n    total += t',
 ex:`temps = [27, 29, 31]; total = 0; for t in temps: total += t; print(total / len(temps))  → 29.0`,
 chk:`What numbers does range(4) produce?`},
{id:'bisect',course:'MTH 209',topic:'Root finding',title:'Bisection method',kw:['bisection','root','numerical','newton'],
 l1:`Guess a number between 1 and 100. Someone says "higher" or "lower" and you halve the range each time. Bisection finds answers the same way.`,
 l2:`The bisection method finds a root of f(x) = 0 in [a, b] when f(a)·f(b) < 0: take the midpoint c, keep the half where the sign changes, repeat. After n steps the interval width is (b − a)/2ⁿ.`,
 l3:`Convergence is linear (rate ½): robust but slow. Newton–Raphson x₍ₙ₊₁₎ = xₙ − f/f′ converges quadratically near simple roots but can diverge; hybrids such as Brent's method combine both. Stop when |f(c)| < ε or the interval is below a tolerance.`,
 f:'c = (a + b)/2   |   width after n steps = (b − a)/2ⁿ',
 ex:`f = x² − 2 on [1, 2]: c = 1.5, f = 0.25 > 0 so the new interval is [1, 1.5]; c = 1.25, f = −0.4375 < 0 so [1.25, 1.5].`,
 chk:`Why must f(a) and f(b) have opposite signs?`},
{id:'sat',course:'PHY 209',topic:'Orbits & satellites',title:'Weather satellites and remote sensing',kw:['satellite','remote sensing','geostationary','infrared','orbit'],
 l1:`A satellite is like a camera on a very tall tower. From up there it sees whole storms at once, even over oceans where nobody lives.`,
 l2:`Geostationary satellites sit about 35,786 km above the equator and always see the same disc; polar orbiters fly near 800 km and cover the globe in passes. Visible imagery shows reflected sunlight; infrared shows emitted heat, so colder (higher) cloud tops suggest deeper convection.`,
 l3:`Measured radiances are converted to brightness temperature via the inverse Planck function. Cloud-top height is estimated by matching brightness temperature to a sounding. Retrievals such as rain rate, SST and aerosol optical depth need calibration, atmospheric correction and validation against ground truth.`,
 f:'v_geo ≈ 3.07 km/s at r ≈ 42,164 km   |   T_b from inverse Planck',
 ex:`Cloud tops colder than about −50 °C over West Africa usually signal deep, potentially heavy-rain convection.`,
 chk:`Why is infrared imagery useful at night when visible imagery is dark?`},
{id:'wave',course:'PHY 204',topic:'Wave properties',title:'Waves: frequency and wavelength',kw:['wave','frequency','wavelength','optics','refraction'],
 l1:`Shake a rope up and down and ripples run along it. How many shakes per second is the frequency; the length of one ripple is the wavelength.`,
 l2:`Wave speed v = fλ and period T = 1/f. Sound, light and ocean waves all obey this. Refraction is the change of direction when speed changes between media (Snell's law n₁ sin θ₁ = n₂ sin θ₂).`,
 l3:`Dispersive waves have phase speed that depends on wavelength; deep-water ocean waves satisfy ω² = gk, so c = √(gλ/2π). Superposition gives interference and standing waves; diffraction limits instrument resolution.`,
 f:'v = f λ   |   T = 1/f   |   n₁ sin θ₁ = n₂ sin θ₂',
 ex:`A 50 Hz wave with λ = 2 m travels at 100 m/s.`,
 chk:`If frequency doubles and speed stays the same, what happens to the wavelength?`},
{id:'thermo',course:'MTC 210',topic:'Ocean circulation',title:'Thermohaline circulation',kw:['thermohaline','ocean current','oceanography','salinity','ocean'],
 l1:`Cold salty water is heavy, like a full bucket; warm fresh water is light. Heavy water sinks and light water floats, and this slow stirring moves heat around the ocean.`,
 l2:`Thermohaline circulation is the density-driven overturning of the global ocean, set by temperature (thermo) and salinity (haline). Deep water forms at high latitudes, spreads along the seafloor and upwells elsewhere over centuries.`,
 l3:`Density follows the equation of state ρ(T, S, p). AMOC strength is monitored directly (for example the RAPID array at 26.5°N). Freshwater input from melting ice can weaken deep-water formation, affecting regional climate and sea level.`,
 f:'ρ = ρ(T, S, p)',
 ex:`Evaporation in the subtropics raises salinity; cooling in the North Atlantic raises density; that water sinks.`,
 chk:`Which makes seawater denser: lower temperature or lower salinity?`},
{id:'beaufort',course:'MLT 204',topic:'Marine weather hazards',title:'Beaufort scale and marine weather',kw:['beaufort','gale','marine weather','sea state','maritime','swell'],
 l1:`Sailors needed a way to describe wind without a gadget, so they used what they saw: calm sea, small ripples, big waves. The Beaufort scale is a 0-to-12 ruler for wind based on how the sea looks.`,
 l2:`The Beaufort scale classifies wind force 0–12 by sea state and effects. Force 8 (gale) is about 34–40 knots; force 12 is hurricane force (64+ knots). Masters use forecasts and warnings to decide routing and port operations.`,
 l3:`Operational marine forecasts give significant wave height, wind, swell and visibility. Offshore operations apply weather windows with limits for crane lifts, helicopter transfers and tank loading, using met-ocean exceedance statistics against operational limits (Hs, Tp).`,
 f:'Beaufort 8 ≈ 34–40 kn   |   Hs = significant wave height',
 ex:`A gale warning (force 8 or more) may suspend small-craft and offshore crew-transfer operations.`,
 chk:`Why does a swell forecast matter even when the local wind is light?`}
];

/* ============ learning engine ============ */
const mk=q=>q.course+'|'+q.topic;
function record(q,ok){const m=S.mastery[mk(q)]||(S.mastery[mk(q)]={c:0,w:0,sw:0});if(ok){m.c++;m.sw=0}else{m.w++;m.sw=(m.sw||0)+1}}
const ratio=m=>(m.c+m.w)?m.c/(m.c+m.w):null;
function topicStats(){return Object.entries(S.mastery).map(([k,m])=>{const [course,topic]=k.split('|');return{course,topic,r:ratio(m),n:m.c+m.w,m}}).filter(x=>x.n>0)}
const strongTopics=()=>topicStats().filter(t=>t.r>=.75&&t.n>=2).sort((a,b)=>b.r-a.r);
const weakTopics=()=>topicStats().filter(t=>t.r<.6).sort((a,b)=>a.r-b.r);
function grade(q,v){if(v===''||v==null||v===undefined)return null;
 if(q.type==='mcq'||q.type==='tf')return String(v)===String(q.a);
 if(q.type==='num'){const n=parseFloat(v);const tol=q.tol!=null?q.tol:Math.max(.01,Math.abs(q.a)*.01);return !isNaN(n)&&Math.abs(n-q.a)<=tol}
 if(q.type==='short'){const s=String(v).toLowerCase();return q.kw.some(k=>s.includes(k))}return false}
const ansText=q=>q.opts?q.opts[q.a]:(q.type==='short'?q.kw[0]:String(q.a));
function readiness(){const m=topicStats();const mastery=m.length?m.reduce((a,t)=>a+t.r,0)/m.length:0;const codeDone=Object.keys(S.done).filter(k=>k.startsWith('C|')).length;
 return Math.round(Math.min(S.portfolio.length,5)/5*30+Math.min(codeDone,6)/6*30+mastery*40)}
function skillScore(){const ex=S.exams.slice(-5);const exAcc=ex.length?ex.reduce((a,e)=>a+e.pct,0)/ex.length/100:0;const bd=Object.values(S.brain);let bc=0,bn=0;bd.forEach(d=>{bc+=d.c||0;bn+=d.n||0});const bAcc=bn?bc/bn:0;
 const les=Object.keys(S.done).filter(k=>k.startsWith('L|')).length;const cons=Math.min(S.streak,30)/30;
 return Math.round((exAcc*.4+bAcc*.3+Math.min(les,14)/14*.2+cons*.1)*100)}

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WX=(()=>{const r=rng(42),rows=[];for(let y=2000;y<=2020;y++)for(let m=1;m<=12;m++){const wet=Math.exp(-Math.pow(m-7.6,2)/(2*2.1*2.1));const rain=Math.max(0,(18+330*wet)*(1+(r()-.5)*.5)*(1-.004*(y-2000)));const temp=27.2+1.5*Math.cos(2*Math.PI*(m-2.6)/12)-1.1*wet*(rain/300)+.035*(y-2000)+(r()-.5)*.8;const hum=62+22*wet+(r()-.5)*5;const wind=2.4+.7*Math.cos(2*Math.PI*(m-3)/12)+(r()-.5)*.5;const pr=1009+1.8*Math.cos(2*Math.PI*(m-1)/12)+(r()-.5)*1.1;rows.push({y,m,temp,rain,hum,wind,pr})}return rows})();
const WVARS={temp:['Temperature','°C','mean'],rain:['Rainfall','mm','sum'],hum:['Relative humidity','%','mean'],wind:['Wind speed','m/s','mean'],pr:['Pressure','hPa','mean']};
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
function linfit(xs,ys){const mx=mean(xs),my=mean(ys);let n=0,d=0;xs.forEach((x,i)=>{n+=(x-mx)*(ys[i]-my);d+=(x-mx)**2});const b=n/d;return{b,a:my-b*mx}}
function corr(xs,ys){const mx=mean(xs),my=mean(ys);let n=0,a=0,b=0;xs.forEach((x,i)=>{n+=(x-mx)*(ys[i]-my);a+=(x-mx)**2;b+=(ys[i]-my)**2});return n/Math.sqrt(a*b)}
function annual(v){const out=[];for(let y=2000;y<=2020;y++){const vals=WX.filter(r=>r.y===y).map(r=>r[v]);out.push(WVARS[v][2]==='sum'?vals.reduce((a,b)=>a+b,0):mean(vals))}return out}
function clim(v){return MONTHS.map((_,i)=>mean(WX.filter(r=>r.m===i+1).map(r=>r[v])))}
function lineSvg(xs,ys,unit,trend){const W=640,H=250,l=48,b=28,t=10,r=12;const mn=Math.min(...ys),mx=Math.max(...ys),pad=(mx-mn)*.12||1;const lo=mn-pad,hi=mx+pad;const X=i=>l+(xs.length>1?i/(xs.length-1):.5)*(W-l-r),Y=v=>t+(1-(v-lo)/(hi-lo))*(H-t-b);
 let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${l-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mu)">${v.toFixed(Math.abs(hi-lo)<10?1:0)}</text>`}
 const step=Math.ceil(xs.length/7);xs.forEach((x,i)=>{if(i%step===0)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mu)">${x}</text>`});

function barSvg(labels,vals){const W=640,H=220,l=44,b=26,t=8,r=8;const mx=Math.max(...vals)*1.1;const bw=(W-l-r)/vals.length;let s='';for(let i=0;i<=3;i++){const v=mx*i/3,y=t+(1-v/mx)*(H-t-b);s+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${l-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mu)">${v.toFixed(mx<20?1:0)}</text>`}
 vals.forEach((v,i)=>{const h=v/mx*(H-t-b);s+=`<rect x="${l+i*bw+4}" y="${H-b-h}" width="${bw-8}" height="${h}" rx="3" fill="var(--cy)" opacity=".85"/><text x="${l+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mu)">${labels[i]}</text>`});return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Bar chart">${s}</svg>`}
function scatterSvg(xs,ys){const W=640,H=250,l=48,b=28,t=10,r=12;const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);const X=v=>l+(v-x0)/(x1-x0)*(W-l-r),Y=v=>t+(1-(v-y0)/(y1-y0))*(H-t-b);let s=`<line x1="${l}" x2="${W-r}" y1="${H-b}" y2="${H-b}" stroke="var(--line)"/><line x1="${l}" x2="${l}" y1="${t}" y2="${H-b}" stroke="var(--line)"/>`;xs.forEach((x,i)=>s+=`<circle cx="${X(x).toFixed(1)}" cy="${Y(ys[i]).toFixed(1)}" r="3" fill="var(--cy)" opacity=".6"/>`);s+=`<text x="${(l+W)/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--mu)">Rainfall (mm/month)</text><text x="12" y="${H/2}" font-size="11" fill="var(--mu)" transform="rotate(-90 12 ${H/2})">Temperature (°C)</text>`;return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Scatter plot">${s}</svg>`}

 const c=findConcept(msg)||(/level|deeper|more|advanced|university|professional/.test(t)||/example|simpl|again|analogy/.test(t)?TS.ctx:null);
 if(c)TS.ctx=c;

 if(/study plan|plan/.test(t)||mode==='Make me a study plan'&&!c){const w=weakTopics().slice(0,3);const days=S.examDate?Math.max(1,Math.ceil((new Date(S.examDate)-new Date())/864e5)):14;const mins=({'30 minutes':30,'1 hour':60,'2 hours':120,'3+ hours':180})[S.profile.time]||60;
  const focus=w.length?w.map(x=>x.topic):['Pressure & wind','Descriptive statistics','Loops & conditions'];

 if(/wrong answer|my mistake|explain my wrong|yesterday/.test(t)||mode==='Explain my wrong answer'&&!c){const w=S.wrong[S.wrong.length-1];if(!w){out.text='No wrong answers recorded yet. Take a quick test, and when you miss something I will walk through it.';out.chips=['Test me'];return out}const q=QS.find(x=>x.id===w.q);out.text=`Your last miss was:\n"${q.q}"\n\nYou answered ${q.opts&&!isNaN(w.given)?q.opts[w.given]:w.given}. The correct answer is ${ansText(q)}.\n${q.exp}\n\nCan you tell me in your own words why that works?`;return out}

/* ---- architecture ---- */
pages.architecture=()=>`<h1 style="font-size:2rem">Platform architecture</h1><p class="mu">What is built now, and exactly where real services plug in without redesigning the app.</p>
<div class="list">
<div><h3>Front end</h3><p>This single-page app: routes, state, learning engine, exam engine, charts. Mobile-first, works offline once loaded, saves progress locally.</p></div>
<div><h3>Authentication and access</h3><p>When this page is served by the EGS server, accounts, sessions, promo codes, payments and owner login are handled on the server with a database as the source of truth. Without the server this copy runs in demo mode and unlocks nothing. Passwords and the owner code are never in the page.</p></div>
<div><h3>Data model</h3><p>Users, Profiles, Programmes (so any faculty can be added), Courses, Topics, Lessons (with three explanation levels), Questions (typed, tagged by topic and difficulty), Attempts, Mastery, StudyPlans, Opportunities (source URL, last verified date, verifier), Portfolio items, Posts.</p></div>
<div><h3>Content pipeline</h3><p>A content system for lessons and questions with review status, licence and author. Opportunities are only published with a source and a verification date.</p></div>
<div><h3>AI tutor</h3><p>Same chat interface, backed by a server-side language model call with the student's mastery map in the prompt, Socratic-teaching instructions, and curriculum grounding. API keys stay on the server.</p></div>
<div><h3>Adaptive engine</h3><p>Per-topic correct/wrong counts and consecutive-miss tracking drive difficulty: lower the level after repeated misses, explain with an analogy, give a worked example, retest, then raise difficulty. Mastery requires repeated success, not one lucky answer.</p></div>
<div><h3>Code sandbox</h3><p>Student code runs in an isolated environment, either in-browser (WebAssembly Python in a Web Worker) or server-side in short-lived containers with no network, no file access outside a scratch folder and strict CPU, memory and time limits. Arbitrary code never runs on the main server.</p></div>
<div><h3>Data layer</h3><p>Weather lab reads through a dataset adapter: sample data now; NetCDF/CSV from ERA5, NOAA or national services later, served as pre-processed time series.</p></div>
<div><h3>Expansion</h3><p>Programmes, courses and career pathways are data, not code, so new faculties and countries are added through content.</p></div></div>`;

function route(){clearInterval(timer);const h=location.hash.replace(/^#\/?/,'')||'home';const parts=h.split('/');let p=parts[0],arg=parts[1];let html,cur=p;
 if(!hasAccess()&&!FREE_ROUTES.includes(p)){try{history.replaceState({i:NAVI},'','#/subscribe')}catch(e){location.hash='#/subscribe';return}route();return}
 if(p==='exam'&&arg==='run'){html=pages.examrun();startClock()}
 else if(p==='exam'&&arg==='result')html=pages.examresult();
 else if(p==='plan30'){cur='dashboard';html=arg?pages.plan30day(arg):pages.plan30()}
 else if(p==='lab'){html=pages.lab(arg);}
 else if(p==='skills'){html=pages.skills(arg)}
 else if(p==='map'){cur='careers';html=pages.map()}
 else if(p==='architecture'){cur='profile';html=pages.architecture()}
 else if(pages[p]){html=pages[p](decodeURIComponent(arg||''))}
 else{html=pages.home();cur='home'}
 $('#view').innerHTML=html;$('#side').innerHTML=navHtml(cur);
 document.querySelectorAll('.tabbar a').forEach(a=>a.classList.toggle('on',a.dataset.t===cur));
 $('#acctBtn').textContent=BE.on?(AUTH.user?(AUTH.owner?'Owner':(firstName()||'Profile')):'Sign in'):((S.user||S.profile.name)?(firstName()||'Profile'):'Sign in');
 window.scrollTo(0,0);if(p==='home'&&POST_home)POST_home();
 const bb=$('#backBtn');if(bb)bb.hidden=(cur==='home');
 const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight}
function startClock(){const tick=()=>{if(!E||!E.limit)return;const left=E.limit-Math.round((Date.now()-E.start)/1000);const c=document.getElementById('clock');if(c){c.textContent=Math.floor(Math.max(0,left)/60)+':'+String(Math.max(0,left)%60).padStart(2,'0')}if(left<=0){finishExam()}};tick();timer=setInterval(tick,1000)}
function rerender(){const y=window.scrollY;route();window.scrollTo(0,y)}

 runExam(p){const [c,m]=p.split('|');launch({course:c,topic:'',mode:m,diff:'any',n:m==='timed'?5:10})},
 diag(p){launch({course:'',topic:'',mode:'diag',diff:'any',n:10,which:p})},
 pick(p){E.ans[E.i]=+p;if(['practice','adaptive','random'].includes(E.cfg.mode)){E.shown=true}rerender()},
 typed(p,t){E.ans[E.i]=t.value},
 check(){const t=document.getElementById('x_ans');if(t)E.ans[E.i]=t.value;E.shown=true;rerender()},
 next(){const t=document.getElementById('x_ans');if(t)E.ans[E.i]=t.value;E.i++;E.shown=false;rerender()},
 prev(){const t=document.getElementById('x_ans');if(t)E.ans[E.i]=t.value;E.i--;E.shown=false;rerender()},
 finish(){const t=document.getElementById('x_ans');if(t)E.ans[E.i]=t.value;finishExam()},
 bans(p){const [i,k]=p.split('|').map(Number);const q=brainToday()[i];const d=S.brain[today()]||(S.brain[today()]={ans:{},c:0,n:0});if(d.ans[i]!==undefined)return;d.ans[i]=k;d.n++;if(k===q.a){d.c++;addXP(4)}else touch();save();rerender()},
 bnum(p){const i=+p;const q=brainToday()[i];const v=parseFloat(val('bn'+i));if(isNaN(v)){toast('Enter a number.');return}const d=S.brain[today()]||(S.brain[today()]={ans:{},c:0,n:0});if(d.ans[i]!==undefined)return;d.ans[i]=v;d.n++;if(Math.abs(v-q.a)<=.5){d.c++;addXP(4)}else touch();save();rerender()},
 dayDone(p){const n=+p;if(S.plan.days[n])delete S.plan.days[n];else{S.plan.days[n]=1;addXP(15);toast('Day '+n+' complete. +15 XP')}save();rerender()},
 labTab(p){location.hash='#/lab/'+(p==='weather'?'':p)},wv(p){UI.wv=p;rerender()},
 plotcsv(){const rows=val('csv').split('\n').map(l=>l.split(',').map(s=>s.trim())).filter(r=>r.length>=2&&!isNaN(parseFloat(r[1])));if(rows.length<2){$('#csvout').innerHTML='<p class="bad">Enter at least two lines in the form x,y with numeric y values.</p>';return}$('#csvout').innerHTML=lineSvg(rows.map(r=>r[0]),rows.map(r=>parseFloat(r[1])),'value',true)},
 cex(p){UI.ci=+p;UI.codeVal=null;rerender()},resetCode(){UI.codeVal=null;rerender()},
 hint(){$('#hintbox').innerHTML=`<div class="note">${esc(CODE_EX[UI.ci].hint)}</div>`},
 run(){const code=val('code');UI.codeVal=code;const ex=CODE_EX[UI.ci];const fails=ex.checks.filter(c=>!c[0].test(code)).map(c=>c[1]);const out=$('#out');
  if(!code.trim()){out.textContent='Write some code first.';return}
  if(fails.length){out.textContent='Not yet. Things to fix:\n• '+fails.join('\n• ')+'\n\nTip: use Hint for a nudge.';return}
  out.textContent='Checks passed.\n\nExpected output:\n'+ex.out;if(!S.done['C|'+UI.ci]){S.done['C|'+UI.ci]=1;addXP(15);toast('Exercise complete. +15 XP')}save()},
 geo(){if(!navigator.geolocation){UI.locMsg='Location is not available in this browser. Choose your city instead.';rerender();return}UI.locMsg='Finding your location...';rerender();navigator.geolocation.getCurrentPosition(p=>{UI.loc={lat:p.coords.latitude,lon:p.coords.longitude,label:'your current location'};UI.locMsg='';rerender()},()=>{UI.locMsg='Could not read your location (permission denied, or blocked in this view). Choose your city instead, or use the map buttons.';rerender()},{timeout:10000,maximumAge:60000})},
 setcity(p,t){if(!t.value)return;const c=CITIES[t.value];UI.loc={lat:c[1],lon:c[2],label:c[0]};UI.locMsg='';rerender()},
 clearloc(){UI.loc=null;UI.locMsg='';rerender()},
 async pay(){const r=await api('/api/pay',{method:'POST',body:{}});if(r.ok&&r.d.link){location.href=r.d.link}else toast(r.d.error||'Could not start the payment.')},
 async refreshStatus(){await refreshMe();toast(accessLabel());rerender()},
 async promo(){const code=val('s_code').trim();if(!code){toast('Enter a promo code.');return}const gd=val('s_grad');const r=await api('/api/promo/redeem',{method:'POST',body:{code,graduationDate:gd||undefined}});
  if(r.ok){await refreshMe();toast('Promo code accepted.');location.hash='#/dashboard';return}toast(r.d.error||'Invalid or unavailable promo code.')},
 async adminLogin(){const r=await api('/api/admin/login',{method:'POST',body:{email:val('ad_email'),code:val('ad_code')}});const c=document.getElementById('ad_code');if(c)c.value='';if(r.ok){await refreshMe();rerender()}else toast(r.d.error||'Invalid credentials.')},
 atab(p){UI.adminTab=p;UI.stId=null;rerender()},
 async promoCreate(){const codes=val('pc_codes').split('\n').map(x=>x.trim()).filter(Boolean);if(!codes.length){toast('Add at least one code.');return}const reuse=document.getElementById('pc_reuse').checked;const mx=val('pc_max');
  const r=await api('/api/admin/promos',{method:'POST',body:{codes,type:val('pc_type'),singleUse:!reuse,maxRedemptions:reuse&&mx?Number(mx):undefined,accessUntil:val('pc_until')||undefined,label:val('pc_label')||undefined}});
  if(r.ok){toast(`Created ${r.d.created}, duplicates ${r.d.duplicates}, rejected ${r.d.invalid}`);rerender()}else toast(r.d.error||'Could not create the codes.')},
 async promoAct(p){const [id,act]=p.split('|');if(act==='revoke'&&!confirm('Revoke the access this code gave? The student loses access immediately.'))return;const r=await api(`/api/admin/promos/${id}/${act}`,{method:'POST',body:act==='revoke'?{confirm:true}:{}});if(r.ok)rerender();else toast(r.d.error||'Failed.')},
 stSearch(){UI.stq=val('st_q');rerender()},stOpen(p){UI.stId=p;rerender()},stBack(){UI.stId=null;rerender()},
 async stSave(){const r=await api('/api/admin/students/'+UI.stId,{method:'PATCH',body:{graduationDate:val('st_grad')||null}});toast(r.ok?'Saved':(r.d.error||'Failed'));if(r.ok)rerender()},
 async stAct(p){const id=UI.stId;let r;
  if(p==='revoke'){if(!confirm('Revoke ALL access for this student (promo, grants and subscription)?'))return;r=await api(`/api/admin/students/${id}/revoke-access`,{method:'POST',body:{confirm:true}})}
  else if(p==='add_month'){if(!confirm('Add one paid month to this student? Use this for a payment you have confirmed in Flutterwave.'))return;r=await api(`/api/admin/students/${id}/add-month`,{method:'POST',body:{confirm:true}})}
  else if(p.startsWith('grant_')){const kind=p==='grant_forever'?'forever':'until_graduation';if(!confirm('Grant free access ('+kind.replace('_',' ')+') to this student?'))return;r=await api(`/api/admin/students/${id}/grant`,{method:'POST',body:{kind,confirm:true}})}
  else r=await api('/api/admin/students/'+id,{method:'PATCH',body:{disabled:p==='disable'}});
  toast(r.ok?'Done':(r.d.error||'Failed'));if(r.ok)rerender()},
 async subCancel(p){if(!confirm('Cancel this subscription now? Access ends immediately.'))return;const r=await api(`/api/admin/subscriptions/${p}/cancel`,{method:'POST',body:{confirm:true}});toast(r.ok?'Cancelled':(r.d.error||'Failed'));if(r.ok)rerender()},
 async payRefund(p){if(!confirm('Mark this payment as refunded and end the access it paid for?'))return;const r=await api(`/api/admin/payments/${p}/refund`,{method:'POST',body:{confirm:true}});toast(r.ok?'Recorded':(r.d.error||'Failed'));if(r.ok)rerender()},
 async annCreate(){const r=await api('/api/admin/announcements',{method:'POST',body:{title:val('an_t'),body:val('an_b')}});toast(r.ok?'Published':(r.d.error||'Failed'));if(r.ok)rerender()},
 async annToggle(p){const [id,v]=p.split('|');const r=await api('/api/admin/announcements/'+id,{method:'PATCH',body:{published:v==='1'}});if(r.ok)rerender()},
 async rsCreate(){const body={kind:val('rs_k'),title:val('rs_t')};if(val('rs_u'))body.url=val('rs_u');if(val('rs_f'))body.fileName=val('rs_f');const r=await api('/api/admin/resources',{method:'POST',body});toast(r.ok?'Added':(r.d.error||'Failed'));if(r.ok)rerender()},
 async rsToggle(p){const [id,v]=p.split('|');const r=await api('/api/admin/resources/'+id,{method:'PATCH',body:{published:v==='1'}});if(r.ok)rerender()},
 lt(p){UI.lt=p;rerender()},cc(p){UI.cc=p;rerender()},country(p){UI.country=p;rerender()},ireg(p,t){UI.reg=t.value;rerender()},icat(p){UI.icat=p;rerender()},
 pchk(p,t){S.pchk[p]=t.checked;save();rerender()},
 padd(){const t=val('p_t').trim();if(!t){toast('Add a project title.');return}S.portfolio.push({t,k:val('p_k'),d:val('p_d')});addXP(10);save();rerender()},pdel(p){S.portfolio.splice(+p,1);save();rerender()},
 cpost(){const t=val('c_t').trim(),b=val('c_b').trim();if(!t){toast('Add a title.');return}S.posts.push({n:firstName()||'Guest',t,b});save();rerender()},
 saveExam(){S.examDate=val('exd');save();toast('Exam date saved')},
 reset(){if(confirm('Delete all progress and profile data on this device?')){try{localStorage.removeItem(KEY)}catch(e){}load();location.hash='#/home';rerender()}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||!A[t.dataset.a])return;if(t.tagName==='INPUT')return;if(t.tagName==='SELECT')return;if(t.dataset.a!=='openLesson'&&t.tagName==='A')return;A[t.dataset.a](t.dataset.p,t,e)});
document.addEventListener('change',e=>{const t=e.target.closest('[data-a]');if(t&&(t.tagName==='SELECT'||t.type==='checkbox')&&A[t.dataset.a]&&!(t.type==='checkbox'&&t.dataset.a==='reg'&&false)){A[t.dataset.a](t.dataset.p,t,e)}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.a==='typed')A.typed(null,t)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='tin')A.tsendin();if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-a]')){e.preventDefault();e.target.click()}});
window.addEventListener('hashchange',()=>{$('#sheet').classList.remove('open');syncNav();route()});

/* ============ init ============ */
load();
const pref=S.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=pref;
try{const st=history.state;if(st&&typeof st.i==='number')NAVI=st.i;else{NAVI=0;history.replaceState({i:0},'')}}catch(e){}
$('#view').innerHTML='<p class="mu">Loading…</p>';
(async()=>{await detect();const q=new URLSearchParams(location.search);let paid=null;if(q.get('reset')){UI.resetToken=q.get('reset');history.replaceState(null,'',location.pathname+'#/reset')}else if(q.has('paid')){paid=q.get('paid');history.replaceState(null,'',location.pathname+location.hash)}route();if(paid!==null)toast(paid==='1'?'Payment received. Your access is being activated.':'Payment was not completed.')})();
</script>
